# <auto-generated>
#   the deployed shape of EmailOutbox — its API and its database, and nothing else
#   Generated by tools/codegen.mjs from the event model. Do not edit by hand:
#   re-run codegen and the change is lost.
#
#   THE ESCAPE HATCH IS DOCKER'S OWN, and it is generated/docker-compose.override.yml —
#   which `docker compose up` merges natively and this generator never writes. A published database
#   port, a different host port and an extra service go straight in it; a changed build goes in as
#   `build: {dockerfile: <your own file>}`. Editing inside THIS file is reverted by the next codegen
#   run, silently, with the symptom arriving later as behaviour rather than as an error.
# </auto-generated>

#   docker compose -f generated/docker-compose.yml up -d --build
#
# WHY THIS EXISTS RATHER THAN "just run the app". `dotnet run` reads appsettings.json and expects a
# Postgres somebody started by hand. This is the whole system in one command, and it is what proves the
# published image can do Wolverine's codegen — which a local run with an SDK on the PATH cannot.
#
# THERE IS NO WEB SERVICE AND NO NGINX, because generated/web/package.json does not exist:
# this system has no front end to serve. Its model declares 1 screen(s) — compose —
# which is a statement about the model rather than about the tree; port one and regenerate to get nginx.

name: emailoutbox

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emailoutbox
    # DELIBERATELY NOT PUBLISHED TO THE HOST. The Testcontainers Postgres the integration suite spins up
    # and the dev-loop container appsettings.json points at are different databases with different
    # lifetimes, and a published port here is how they get confused for each other. Nothing outside this
    # network needs to reach it; docker-compose.override.yml is where to publish it if you disagree.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emailoutbox"]
      interval: 3s
      timeout: 3s
      retries: 20
    tmpfs:
      # The demo database is disposable, and a run that inherits the last one's state is a run asserting
      # on somebody else's data. `down` and `up` is a clean world.
      - /var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # THE SEED LIVES BEHIND THIS. Program.cs does `if (builder.Environment.IsDevelopment())
      # marten.InitializeWith(new GenesisData())`, so without this line the app is healthy, every endpoint
      # answers 200, and every read comes back empty — indistinguishable from "nothing here yet".
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Marten: "Host=db;Port=5432;Database=emailoutbox;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    # Published so a failing run can be interrogated with curl against the process compose started,
    # rather than against a second one started by hand. It is 8081 rather than 8080 because 8080 is the
    # browser's origin by convention here, and the API's door must not move when a front end arrives.
    ports:
      - "8081:8080"
