# The HUMAN's Postgres. For running the app, clicking through it, and looking at the data.
#
# It has nothing to do with the tests, and that separation is deliberate rather than tidy:
#
#   * Marten manages schema. A test run pointed at this database would drop the demo data you were
#     halfway through creating.
#   * Testcontainers owns a container lifecycle. Compose owning one too means two things fighting
#     over the same port and the same volume.
#   * Tests must see an empty event store, and a demo is only interesting once it is full.
#
# So: a different port (5433, not 5432), a different database name, and nothing in the test project
# ever reads this file. See CLAUDE.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hourbooking-demo-db
    environment:
      POSTGRES_DB: hourbooking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - hourbooking-demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hourbooking"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hourbooking-demo-data:
